<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ятзи</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c4161c'/%3E%3Crect x='12' y='12' width='40' height='40' rx='9' fill='%23fff' transform='rotate(-10 32 32)'/%3E%3Ccircle cx='23' cy='23' r='4' fill='%235b2a86'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%235b2a86'/%3E%3Ccircle cx='41' cy='41' r='4' fill='%235b2a86'/%3E%3C/svg%3E">
<style>
:root {
  --bg: oklch(0.97 0.006 90);
  --surface: oklch(0.995 0.004 90);
  --ink: oklch(0.24 0.02 260);
  --muted: oklch(0.48 0.02 260);
  --line: oklch(0.89 0.01 90);
  --accent: oklch(0.52 0.12 175);
  --accent-ink: oklch(0.99 0.01 175);
  --accent-soft: oklch(0.93 0.05 175);
  --die: oklch(1 0 0);
  --pip: oklch(0.25 0.02 260);
  --held: oklch(0.93 0.05 175);
  --shadow: 0 2px 0 oklch(0.85 0.01 90), 0 8px 20px -8px oklch(0.3 0.03 260 / .25);
  --focus: oklch(0.55 0.18 260);
  --die-edge: oklch(0.62 0.02 260);
  --die-shadow: 0 3px 0 oklch(0.7 0.015 260), 0 10px 18px -6px oklch(0.25 0.03 260 / .45);
  --overlay: oklch(0.15 0.02 260 / .6);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.2 0.015 260);
    --surface: oklch(0.25 0.018 260);
    --ink: oklch(0.95 0.008 90);
    --muted: oklch(0.75 0.015 260);
    --line: oklch(0.35 0.02 260);
    --accent: oklch(0.74 0.11 175);
    --accent-ink: oklch(0.2 0.03 175);
    --accent-soft: oklch(0.33 0.05 175);
    --die: oklch(0.93 0.01 90);
    --pip: oklch(0.22 0.02 260);
    --held: oklch(0.4 0.07 175);
    --shadow: 0 2px 0 oklch(0.16 0.01 260), 0 8px 20px -8px oklch(0 0 0 / .6);
    --focus: oklch(0.78 0.14 260);
    --die-edge: transparent;
    --die-shadow: var(--shadow);
  }
}
:root[data-theme="dark"] {
    --bg: oklch(0.2 0.015 260);
    --surface: oklch(0.25 0.018 260);
    --ink: oklch(0.95 0.008 90);
    --muted: oklch(0.75 0.015 260);
    --line: oklch(0.35 0.02 260);
    --accent: oklch(0.74 0.11 175);
    --accent-ink: oklch(0.2 0.03 175);
    --accent-soft: oklch(0.33 0.05 175);
    --die: oklch(0.93 0.01 90);
    --pip: oklch(0.22 0.02 260);
    --held: oklch(0.4 0.07 175);
    --shadow: 0 2px 0 oklch(0.16 0.01 260), 0 8px 20px -8px oklch(0 0 0 / .6);
    --focus: oklch(0.78 0.14 260);
    --die-edge: transparent;
    --die-shadow: var(--shadow);
}

* { box-sizing: border-box; }
body {
  transition: background-color .3s ease, color .3s ease;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
}
html { scroll-behavior: smooth; }
button { font-family: inherit; }
button {
  transition: background-color .2s ease, border-color .2s ease, color .2s ease,
    transform .15s ease, box-shadow .2s ease, opacity .2s ease;
}
button:not(:disabled):active { transform: scale(.97); }
.screen { display: flex; flex-direction: column; gap: 16px; animation: fade-up .35s ease both; }
@keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
@keyframes pop-in { from { transform: scale(.82); opacity: .4; } to { transform: scale(1); opacity: 1; } }
@keyframes sheet-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.app { max-width: 900px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }

/* Шапка */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.turn { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.turn small { font-size: 13px; color: var(--muted); }
.turn strong { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.layout { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; min-width: 0; }

/* Панель кубиков */
.play { flex: 1 1 100%; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.status-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 24px; }
.status { font-size: 15px; color: var(--muted); }
.roll-dots { display: flex; gap: 6px; }
.roll-dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent); transition: background-color .3s ease; }
.roll-dots i.on { background: var(--accent); }

.dice { display: flex; gap: 12px; justify-content: center; }
.die-btn {
  flex: 1 1 0; max-width: 72px; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: none; border: none; padding: 0; cursor: pointer; color: inherit;
}
.die-btn:disabled { cursor: default; }
.die {
  width: 100%; aspect-ratio: 1; border-radius: 16px;
  background: var(--die); border: 3px solid var(--die-edge); box-shadow: var(--die-shadow);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 12%;
  transition: transform .3s cubic-bezier(.2, .8, .3, 1), background-color .25s ease, border-color .25s ease, opacity .3s ease;
}
.die.fresh { opacity: .45; }
.die.held { background: var(--held); border-color: var(--accent); transform: translateY(-8px); }
.die span { display: flex; align-items: center; justify-content: center; }
.die i { width: 68%; aspect-ratio: 1; border-radius: 50%; background: transparent; }
.die:not(.rolling) i { transition: background-color .25s ease; }
.die i.on { background: var(--pip); }
.die i.ph { background: var(--muted); }
.die-tag { font-size: 12px; font-weight: 700; color: var(--accent); height: 14px; letter-spacing: .04em; }

.roll-btn {
  min-height: 56px; border-radius: 14px; border: none;
  background: var(--accent); color: var(--accent-ink);
  font-size: 18px; font-weight: 700; cursor: pointer;
}
.roll-btn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

/* Таблица очков */
.sheet { flex: 1 1 320px; overflow: hidden; }
.grid { display: grid; grid-template-columns: 1fr 84px 84px; gap: 4px; align-items: center; position: relative; }
/* Разделитель между колонками игроков */
.sheet .grid::after {
  content: ''; position: absolute; top: 0; bottom: 0; right: calc(10px + 84px + 2px);
  width: 1px; background: var(--line); pointer-events: none;
}
.sheet-head { padding: 10px 10px 8px; border-bottom: 1px solid var(--line); }
.head-name {
  text-align: center; font-size: 13px; font-weight: 700; padding: 6px 2px; border-radius: 10px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.head-name.current { background: var(--accent); color: var(--accent-ink); }
.row { padding: 3px 10px; }
.row .label { font-size: 15px; font-weight: 500; padding-left: 4px; }
.row .label small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 2px; }
.row.section { padding: 10px 10px 2px; }
.row.section .label { font-size: 12px; font-weight: 700; color: var(--muted); }
.row.info { padding: 6px 10px; }
.row.info .label { font-size: 14px; font-weight: 600; color: var(--muted); }
.row.top-line { border-top: 1px solid var(--line); }
.row.total { padding: 8px 10px; background: var(--accent-soft); border-top: 1px solid var(--line); }
.row.total .label { font-size: 16px; font-weight: 700; }

.cell {
  min-height: 40px; border-radius: 10px; border: 2px solid transparent;
  background: transparent; color: var(--ink); font-size: 16px; padding: 0;
  display: flex; align-items: center; justify-content: center; font-family: inherit;
}
.row.info .cell, .row.total .cell { min-height: 32px; }
.row.total .cell { font-weight: 700; }
.cell { transition: background-color .2s ease, border-color .2s ease, color .2s ease, transform .15s ease; }
.cell.filled { font-weight: 700; animation: pop-in .35s cubic-bezier(.2, .8, .3, 1); }
@media (hover: hover) { .cell.hint:hover { background: var(--accent-soft); border-color: var(--accent); } }
.cell.zero { color: var(--muted); font-weight: 400; text-decoration: line-through; }
.cell.hint { cursor: pointer; background: var(--bg); border: 2px dashed var(--line); color: var(--muted); }
.cell.hint.best { background: var(--accent-soft); border: 2px solid var(--accent); color: var(--ink); font-weight: 700; }
.cell.blocked, .cell.muted { color: var(--muted); font-weight: 400; }
.cell.accent { color: var(--accent); font-weight: 700; }

/* Окно конца игры */
.overlay {
  position: fixed; inset: 0; background: var(--overlay); z-index: 10;
  display: flex; align-items: center; justify-content: center; padding: 16px;
  animation: fade-in .22s ease both;
}
.overlay.closing { animation: fade-out .18s ease forwards; }
.dialog {
  animation: pop-in .28s cubic-bezier(.2, .8, .3, 1) both;
  background: var(--surface); width: 100%; max-width: 400px; border-radius: 24px; padding: 24px;
  display: flex; flex-direction: column; gap: 18px;
}
.dialog small { font-size: 14px; color: var(--muted); }
.dialog h2 { margin: 4px 0 0; font-size: 28px; }
.results { display: flex; flex-direction: column; gap: 8px; }
.result {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line);
}
.result.win { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
.result b { font-size: 24px; }
.btn-primary {
  min-height: 52px; border-radius: 14px; border: none;
  background: var(--accent); color: var(--accent-ink); font-size: 16px; font-weight: 700; cursor: pointer;
}
/* Стартовый экран: подстраивается под высоту и ширину экрана без прокрутки */
.start {
  max-width: 440px; margin: 0 auto; width: 100%;
  min-height: calc(100vh - 32px); min-height: calc(100dvh - 32px);
  display: flex; flex-direction: column; justify-content: center; gap: clamp(10px, 2.8vh, 26px);
}
.brand-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.brand { display: flex; flex-direction: column; gap: clamp(6px, 1.6vh, 14px); align-items: flex-start; }
.logo { --d: clamp(34px, 6vh, 44px); display: flex; gap: 8px; }
.logo .die-mini {
  width: var(--d); height: var(--d); border-radius: calc(var(--d) * .26); background: var(--die); box-shadow: var(--shadow);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: calc(var(--d) * .16);
}
.logo .die-mini span { display: flex; align-items: center; justify-content: center; }
.logo .die-mini i { width: calc(var(--d) * .15); height: calc(var(--d) * .15); border-radius: 50%; }
.logo .die-mini i.on { background: var(--pip); }
.brand h1 { margin: 0; font-size: clamp(32px, 6.5vh, 48px); letter-spacing: -0.02em; line-height: 1; }
.field { display: flex; flex-direction: column; gap: clamp(6px, 1.2vh, 10px); }
.field-title { font-size: 14px; font-weight: 600; color: var(--muted); }
.mode-btn, .name-input, .name-fixed {
  padding: clamp(8px, 1.8vh, 14px) 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface);
  color: var(--ink); font-size: clamp(15px, 2.5vh, 17px); min-height: clamp(44px, 7vh, 56px); font-family: inherit;
}
.mode-btn { text-align: left; cursor: pointer; }
.mode-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.modes { display: flex; flex-direction: column; gap: 8px; }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.name-input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.name-fixed { border-style: dashed; color: var(--muted); display: flex; align-items: center; }
/* Низкие широкие экраны (телефон лёжа): две колонки */
@media (min-width: 520px) and (max-height: 560px) {
  .start { max-width: 820px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-content: center; column-gap: clamp(16px, 4vw, 32px); row-gap: 8px; }
  .start > .brand-row { grid-column: 1; grid-row: 1 / span 5; align-self: center; }
  .start > :not(.brand-row) { grid-column: 2; }
  .field { gap: 4px; }
  .field-title { font-size: 12px; }
  .mode-btn, .name-input, .name-fixed { min-height: 38px; padding: 6px 12px; font-size: 15px; line-height: 1.15; }
  .modes { flex-direction: row; }
  .modes .mode-btn { flex: 1; min-width: 0; }
  .players { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 8px; }
  .players .name-input, .players .name-fixed { min-width: 0; width: 100%; }
  .players .field-title { grid-column: 1 / -1; }
  .btn-play, .btn-secondary.wide { min-height: 40px; }
}
.btn-play {
  min-height: clamp(46px, 7vh, 56px); border-radius: 14px; border: none; background: var(--accent); color: var(--accent-ink);
  font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: var(--shadow);
}
.dialog-actions { display: flex; gap: 10px; }
.dialog-actions button { flex: 1; }
.btn-secondary {
  min-height: 52px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface);
  color: var(--ink); font-size: 16px; cursor: pointer;
}
/* Анимация броска и окна */
@keyframes shake {
  0%, 100% { transform: translate(0, 0) rotate(0); }
  25% { transform: translate(-1px, -3px) rotate(-5deg); }
  50% { transform: translate(1px, 0) rotate(3deg); }
  75% { transform: translate(-1px, -2px) rotate(-3deg); }
}
.die.rolling { animation: shake .4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
.topbar-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.topbar-actions { display: flex; gap: 8px; }
.theme-btn {
  width: 44px; height: 44px; flex: none; padding: 0; border-radius: 12px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.theme-btn svg { width: 22px; height: 22px; }
@media (min-width: 561px) {
  .topbar-head { display: contents; }
  .topbar .turn { margin-right: auto; }
  .topbar .theme-btn { order: 3; }
}
@media (max-width: 560px) {
  .topbar { flex-direction: column; align-items: stretch; }
  .topbar-actions { display: grid; grid-template-columns: repeat(3, 1fr); }
  .topbar-actions .btn-secondary.small { padding: 0 8px; }
}
.btn-secondary.small { min-height: 44px; padding: 0 14px; border-radius: 12px; font-size: 15px; }
.btn-secondary.wide { padding: 0 22px; min-height: clamp(46px, 7vh, 56px); font-size: 17px; }
.start-actions { display: flex; gap: 10px; }
.start-actions .btn-play { flex: 1; }
.muted-text { color: var(--muted); line-height: 1.5; }
.dialog h2 { margin: 0; }
.sheet-overlay { align-items: flex-end; padding: 0; }
.sheet-overlay .dialog { animation: sheet-up .32s cubic-bezier(.2, .8, .3, 1) both; }
.dialog.rules {
  max-width: 560px; max-height: 88vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 22px; gap: 18px;
}
.rules-head { display: flex; justify-content: space-between; align-items: center; }
.rules-head h2 { font-size: 26px; }
.rule { display: flex; flex-direction: column; gap: 6px; }
.rule span { color: var(--muted); line-height: 1.5; }

<body>
<main class="app" id="app"></main>

<script>
// <logic>
// ===== Константы =====
var UPPER = ['ones', 'twos', 'threes', 'fours', 'fives', 'sixes'];
var LOWER = ['threeKind', 'fourKind', 'fullHouse', 'smallStraight', 'largeStraight', 'yahtzee', 'chance'];
var CATEGORIES = UPPER.concat(LOWER);
var NUM_DICE = 5;
var MAX_ROLLS = 3;
var UPPER_BONUS_THRESHOLD = 63;
var UPPER_BONUS = 35;
var YAHTZEE_BONUS = 100;
var FIXED_SCORES = { fullHouse: 25, smallStraight: 30, largeStraight: 40, yahtzee: 50 };

// ===== Чистые функции подсчёта =====
function isRolled(dice) {
  return dice.length === NUM_DICE && dice.every(function (d) { return d >= 1 && d <= 6; });
}

// counts[1..6] — сколько раз выпала каждая грань
function countFaces(dice) {
  var counts = [0, 0, 0, 0, 0, 0, 0];
  dice.forEach(function (d) { counts[d]++; });
  return counts;
}

function sum(dice) {
  return dice.reduce(function (a, b) { return a + b; }, 0);
}

function hasRun(dice, length) {
  var counts = countFaces(dice);
  for (var start = 1; start + length - 1 <= 6; start++) {
    var ok = true;
    for (var f = start; f < start + length; f++) if (counts[f] === 0) ok = false;
    if (ok) return true;
  }
  return false;
}

function isYahtzee(dice) {
  return isRolled(dice) && dice.every(function (d) { return d === dice[0]; });
}

// Очки категории по обычным правилам (без жокера)
function scoreRaw(cat, dice) {
  if (!isRolled(dice)) return 0;
  var counts = countFaces(dice);
  var max = Math.max.apply(null, counts);
  var upperIdx = UPPER.indexOf(cat);
  if (upperIdx >= 0) return counts[upperIdx + 1] * (upperIdx + 1);
  switch (cat) {
    case 'threeKind': return max >= 3 ? sum(dice) : 0;
    case 'fourKind': return max >= 4 ? sum(dice) : 0;
    case 'fullHouse': return counts.indexOf(3) >= 0 && counts.indexOf(2) >= 0 ? FIXED_SCORES.fullHouse : 0;
    case 'smallStraight': return hasRun(dice, 4) ? FIXED_SCORES.smallStraight : 0;
    case 'largeStraight': return hasRun(dice, 5) ? FIXED_SCORES.largeStraight : 0;
    case 'yahtzee': return max === 5 ? FIXED_SCORES.yahtzee : 0;
    case 'chance': return sum(dice);
  }
  return 0;
}

// ===== Игрок и таблица очков =====
function createPlayer(name) {
  var scores = {};
  CATEGORIES.forEach(function (c) { scores[c] = null; });
  return { name: name, scores: scores, yahtzeeBonuses: 0 };
}

function openCategories(player) {
  return CATEGORIES.filter(function (c) { return player.scores[c] === null; });
}

// Жокер: выпал ятзи, а клетка «Ятзи» уже заполнена (50 или 0)
function isJoker(player, dice) {
  return isYahtzee(dice) && player.scores.yahtzee !== null;
}

// Бонус +100: выпал ятзи, а в клетке «Ятзи» стоит 50
function earnsYahtzeeBonus(player, dice) {
  return isYahtzee(dice) && player.scores.yahtzee === FIXED_SCORES.yahtzee;
}

// Категории, в которые можно записать текущий бросок (с учётом жокера)
function allowedCategories(player, dice) {
  if (!isRolled(dice)) return [];
  var open = openCategories(player);
  if (!isJoker(player, dice)) return open;
  var upperCat = UPPER[dice[0] - 1];
  if (open.indexOf(upperCat) >= 0) return [upperCat];
  var lowerOpen = open.filter(function (c) { return LOWER.indexOf(c) >= 0; });
  return lowerOpen.length ? lowerOpen : open;
}

// Очки, которые получит игрок за категорию (по жокеру фулл-хаус и стриты дают полные очки)
function possibleScore(player, cat, dice) {
  if (isJoker(player, dice) && (cat === 'fullHouse' || cat === 'smallStraight' || cat === 'largeStraight')) {
    return FIXED_SCORES[cat];
  }
  return scoreRaw(cat, dice);
}

function upperSum(player) {
  return UPPER.reduce(function (a, c) { return a + (player.scores[c] || 0); }, 0);
}

function upperBonus(player) {
  return upperSum(player) >= UPPER_BONUS_THRESHOLD ? UPPER_BONUS : 0;
}

function lowerSum(player) {
  return LOWER.reduce(function (a, c) { return a + (player.scores[c] || 0); }, 0);
}

function totalScore(player) {
  return upperSum(player) + upperBonus(player) + lowerSum(player) + player.yahtzeeBonuses * YAHTZEE_BONUS;
}

function isPlayerDone(player) {
  return openCategories(player).length === 0;
}

// ===== Состояние игры =====
function createGame(names) {
  return {
    players: names.map(createPlayer),
    current: 0,
    dice: [1, 1, 1, 1, 1],
    held: [false, false, false, false, false],
    rollsUsed: 0,
    gameOver: false
  };
}

function rollsLeft(state) {
  return MAX_ROLLS - state.rollsUsed;
}

// Бросает незафиксированные кубики (при первом броске — все)
function roll(state, rng) {
  rng = rng || Math.random;
  if (state.gameOver || state.rollsUsed >= MAX_ROLLS) return false;
  if (state.rollsUsed === 0) state.held = [false, false, false, false, false];
  for (var i = 0; i < NUM_DICE; i++) {
    if (!state.held[i]) state.dice[i] = 1 + Math.floor(rng() * 6);
  }
  state.rollsUsed++;
  return true;
}

// Фиксация/разблокировка кубика: возможна между бросками
function toggleHold(state, index) {
  if (state.gameOver || state.rollsUsed < 1 || state.rollsUsed >= MAX_ROLLS) return false;
  if (index < 0 || index >= NUM_DICE) return false;
  state.held[index] = !state.held[index];
  return true;
}

// Запись результата в категорию; передаёт ход следующему игроку
function scoreCategory(state, cat) {
  if (state.gameOver || state.rollsUsed < 1) return false;
  var player = state.players[state.current];
  if (allowedCategories(player, state.dice).indexOf(cat) < 0) return false;
  var points = possibleScore(player, cat, state.dice);
  if (earnsYahtzeeBonus(player, state.dice)) player.yahtzeeBonuses++;
  player.scores[cat] = points;
  endTurn(state);
  return true;
}

function endTurn(state) {
  state.dice = [1, 1, 1, 1, 1];
  state.held = [false, false, false, false, false];
  state.rollsUsed = 0;
  if (state.players.every(isPlayerDone)) {
    state.gameOver = true;
  } else {
    state.current = (state.current + 1) % state.players.length;
  }
}

// ===== Компьютерный соперник =====
// Решения принимаются по ожидаемой ценности: компьютер перебирает, какие кубики оставить,
// считает, что в среднем выпадет при добросе, и оценивает каждую клетку как
// «очки минус то, сколько в среднем даёт эта клетка», плюс вероятность бонуса 35.

// Средний результат клеток при хорошей игре (используется как «цена упущенной возможности»)
var CATEGORY_AVG = {
  ones: 2.1, twos: 5.3, threes: 8.6, fours: 12.1, fives: 15.7, sixes: 19.2,
  threeKind: 21.7, fourKind: 13.1, fullHouse: 22.9, smallStraight: 29.5,
  largeStraight: 32.7, yahtzee: 16.9, chance: 22
};

// Вероятность набрать 63 в верхней секции при ожидаемой итоговой сумме expected
function upperBonusChance(expected, settled) {
  if (settled) return expected >= UPPER_BONUS_THRESHOLD ? 1 : 0;
  return 1 / (1 + Math.exp(-(expected - UPPER_BONUS_THRESHOLD) / 5));
}

// Ценность записи текущего броска в клетку cat
function cpuCategoryValue(player, cat, dice) {
  var pts = possibleScore(player, cat, dice);
  var value = pts - CATEGORY_AVG[cat];
  var ui = UPPER.indexOf(cat);
  if (ui >= 0 && upperSum(player) < UPPER_BONUS_THRESHOLD) {
    var expectedBefore = upperSum(player);
    var expectedAfter = upperSum(player) + pts;
    var openAfter = 0;
    UPPER.forEach(function (c) {
      if (player.scores[c] === null) {
        expectedBefore += CATEGORY_AVG[c];
        if (c !== cat) { expectedAfter += CATEGORY_AVG[c]; openAfter++; }
      }
    });
    value += UPPER_BONUS * (upperBonusChance(expectedAfter, openAfter === 0) - upperBonusChance(expectedBefore, false));
  }
  if (earnsYahtzeeBonus(player, dice)) value += YAHTZEE_BONUS;
  return value;
}

// Лёгкий уровень: оставляет самое частое значение (при равенстве — большее)
function cpuEasyHold(dice) {
  var counts = countFaces(dice);
  var best = 1;
  for (var v = 1; v <= 6; v++) if (counts[v] >= counts[best]) best = v;
  return dice.map(function (d) { return d === best; });
}

// Лёгкий уровень: клетка с максимумом очков (при равенстве — первая в таблице)
function cpuEasyCategory(player, dice) {
  var allowed = allowedCategories(player, dice);
  var best = allowed[0], bestPts = -1;
  allowed.forEach(function (c) {
    var pts = possibleScore(player, c, dice);
    if (pts > bestPts) { bestPts = pts; best = c; }
  });
  return best;
}

// Лучшая клетка для записи: максимум ценности среди разрешённых (level: 'easy' или 'hard')
function cpuChooseCategory(player, dice, level) {
  if (level === 'easy') return cpuEasyCategory(player, dice);
  var allowed = allowedCategories(player, dice);
  var best = allowed[0], bestValue = -Infinity;
  allowed.forEach(function (c) {
    var v = cpuCategoryValue(player, c, dice);
    if (v > bestValue) { bestValue = v; best = c; }
  });
  return best;
}

// Все возможные исходы доброса k кубиков (с точностью до порядка) и их вероятности
var rollOutcomesCache = {};
function rollOutcomes(k) {
  if (rollOutcomesCache[k]) return rollOutcomesCache[k];
  var fact = [1, 1, 2, 6, 24, 120];
  var total = Math.pow(6, k), out = [];
  (function walk(prefix, min) {
    if (prefix.length === k) {
      var counts = [0, 0, 0, 0, 0, 0, 0], ways = fact[k];
      prefix.forEach(function (v) { counts[v]++; });
      for (var f = 1; f <= 6; f++) ways /= fact[counts[f]];
      out.push({ faces: prefix.slice(), p: ways / total });
      return;
    }
    for (var v = min; v <= 6; v++) { prefix.push(v); walk(prefix, v); prefix.pop(); }
  })([], 1);
  rollOutcomesCache[k] = out;
  return out;
}

function sortedDice(dice) {
  return dice.slice().sort(function (a, b) { return a - b; });
}

// Исходы доброса при оставленных кубиках held (отсортированный массив): итоговые кубики и вероятности.
// Не зависят от игрока, поэтому кэшируются между вызовами.
var transitionsCache = {};
function transitionsFor(held) {
  var key = held.join('');
  if (!transitionsCache[key]) {
    transitionsCache[key] = rollOutcomes(NUM_DICE - held.length).map(function (o) {
      var dice = sortedDice(held.concat(o.faces));
      return { dice: dice, key: dice.join(''), p: o.p };
    });
  }
  return transitionsCache[key];
}

// Варианты «что оставить» для набора кубиков (без повторов по составу, без варианта «оставить все»)
var holdOptionsCache = {};
function holdOptionsFor(sorted) {
  var key = sorted.join('');
  if (!holdOptionsCache[key]) {
    var seen = {}, options = [];
    for (var mask = 0; mask < (1 << NUM_DICE) - 1; mask++) {
      var held = sorted.filter(function (_, i) { return mask & (1 << i); });
      var hk = held.join('');
      if (!seen[hk]) { seen[hk] = true; options.push(held); }
    }
    holdOptionsCache[key] = options;
  }
  return holdOptionsCache[key];
}

// Выбор кубиков для сохранения: массив из пяти boolean.
// Если все true — лучше остановиться и записать результат (добрасывать невыгодно).
function cpuChooseHold(player, dice, rollsLeft, level) {
  var allHeld = [true, true, true, true, true];
  if (rollsLeft <= 0) return allHeld;
  if (level === 'easy') return cpuEasyHold(dice);
  var stopMemo = {};
  var evMemo = [];
  for (var r = 0; r <= rollsLeft; r++) evMemo.push({});

  function stopValue(sorted, key) {
    if (stopMemo[key] === undefined) {
      var best = -Infinity;
      allowedCategories(player, sorted).forEach(function (c) {
        var v = cpuCategoryValue(player, c, sorted);
        if (v > best) best = v;
      });
      stopMemo[key] = best;
    }
    return stopMemo[key];
  }

  // Ожидаемая ценность: оставить held и добросить остальные, когда после этого осталось rerolls добросов
  function rerollValue(held, rerolls) {
    var total = 0, list = transitionsFor(held);
    for (var i = 0; i < list.length; i++) total += list[i].p * bestValue(list[i].dice, list[i].key, rerolls);
    return total;
  }

  // Лучшая ценность позиции, если осталось rerolls добросов (можно и остановиться)
  function bestValue(sorted, key, rerolls) {
    if (rerolls === 0) return stopValue(sorted, key);
    var memo = evMemo[rerolls];
    if (memo[key] === undefined) {
      var best = stopValue(sorted, key), options = holdOptionsFor(sorted);
      for (var i = 0; i < options.length; i++) {
        var v = rerollValue(options[i], rerolls - 1);
        if (v > best) best = v;
      }
      memo[key] = best;
    }
    return memo[key];
  }

  var sortedAll = sortedDice(dice);
  var bestMask = null, bestV = stopValue(sortedAll, sortedAll.join('')) + 1e-9;
  for (var mask = 0; mask < (1 << NUM_DICE) - 1; mask++) {
    var held = [];
    dice.forEach(function (d, i) { if (mask & (1 << i)) held.push(d); });
    var v = rerollValue(sortedDice(held), rollsLeft - 1);
    if (v > bestV) { bestV = v; bestMask = mask; }
  }
  if (bestMask === null) return allHeld;
  return dice.map(function (_, i) { return (bestMask & (1 << i)) !== 0; });
}

var Yahtzee = {
  UPPER: UPPER, LOWER: LOWER, CATEGORIES: CATEGORIES, MAX_ROLLS: MAX_ROLLS,
  isRolled: isRolled, countFaces: countFaces, isYahtzee: isYahtzee,
  scoreRaw: scoreRaw, createPlayer: createPlayer, openCategories: openCategories,
  isJoker: isJoker, earnsYahtzeeBonus: earnsYahtzeeBonus,
  allowedCategories: allowedCategories, possibleScore: possibleScore,
  upperSum: upperSum, upperBonus: upperBonus, lowerSum: lowerSum, totalScore: totalScore,
  isPlayerDone: isPlayerDone, createGame: createGame, rollsLeft: rollsLeft,
  roll: roll, toggleHold: toggleHold, scoreCategory: scoreCategory,
  cpuChooseHold: cpuChooseHold, cpuChooseCategory: cpuChooseCategory,
  cpuEasyHold: cpuEasyHold, cpuEasyCategory: cpuEasyCategory
};
// </logic>

  threeKind: 'Сет', fourKind: 'Каре', fullHouse: 'Фулл-хаус', smallStraight: 'Малый стрит',
  largeStraight: 'Большой стрит', yahtzee: 'Ятзи', chance: 'Шанс'
};

var PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

var app = { screen: 'start', mode: 'cpu', level: 'hard', n1: 'Игрок 1', n2: 'Игрок 2', thinking: false, rolling: false, display: null, modal: null };

// ===== Тема: авто (по системе) / светлая / тёмная; выбор хранится в localStorage =====

function loadTheme() {
  try {
    var saved = localStorage.getItem(THEME_KEY);
    if (saved === 'light' || saved === 'dark') themeChoice = saved;
  } catch (e) { /* хранилище недоступно — остаёмся на авто */ }
}

function saveTheme() {
  try { localStorage.setItem(THEME_KEY, themeChoice); } catch (e) { /* без сохранения */ }
}

function systemPrefersDark() {
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return false; }
}

function isDarkTheme() {
  return themeChoice === 'auto' ? systemPrefersDark() : themeChoice === 'dark';
}

function applyTheme() {
  var root = document.documentElement;
  if (themeChoice === 'auto') {
    root.removeAttribute('data-theme');
    root.style.colorScheme = '';
  } else {
    root.setAttribute('data-theme', themeChoice);
    root.style.colorScheme = themeChoice;
  }
}

function toggleTheme() {
  themeChoice = isDarkTheme() ? 'light' : 'dark';
  applyTheme();
  saveTheme();
}

function themeButtonHtml() {
  var dark = isDarkTheme();
  var icon = dark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'

}

function isHumanTurn() {
  return !(app.mode === 'cpu' && game.current === 1);
}

function sleep(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}

function startGame() {
  var first = app.n1.trim() || 'Игрок 1';
  var second = app.mode === 'cpu' ? 'Компьютер' : (app.n2.trim() || 'Игрок 2');
  gameToken++;
  app.thinking = false;
  app.rolling = false;
  app.display = null;
  app.modal = null;
  game = createGame([first, second]);
  app.screen = 'game';
}

function toMenu() {
  gameToken++;
  app.thinking = false;
  app.rolling = false;
  app.display = null;
  app.modal = null;
  app.screen = 'start';
}

function prefersReducedMotion() {
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
}

// Бросок с анимацией: итог уже в состоянии, на экране кубики недолго «крутятся»
async function rollAnimated() {
  var token = gameToken;
  if (app.rolling || !roll(game)) return;
  if (!prefersReducedMotion()) {
    var finalDice = game.dice.slice();
    var held = game.held.slice();
    app.rolling = true;
    // Кубики «замедляются»: интервалы между сменами граней растут
    var pauses = [60, 70, 80, 95, 115, 140, 170];
    for (var t = 0; t < pauses.length; t++) {
      app.display = finalDice.map(function (v, i) { return held[i] ? v : 1 + Math.floor(Math.random() * 6); });
      render();
      await sleep(pauses[t]);
      if (token !== gameToken) return;
    }
  }
  app.rolling = false;
  app.display = null;
  render();
}

// Ход компьютера: бросок, до двух добросов с лучшим выбором кубиков, запись в лучшую по ценности клетку
async function cpuTurn() {
  var token = gameToken;
  var alive = function () { return token === gameToken; };
  app.thinking = true;
  render();
  await sleep(800); if (!alive()) return;
  await rollAnimated(); if (!alive()) return;
  for (var k = 0; k < 2; k++) {
    await sleep(700); if (!alive()) return;
    var hold = cpuChooseHold(game.players[game.current], game.dice, rollsLeft(game), app.level);
    game.held = hold; render();
    if (hold.every(Boolean)) break; // все кубики оставлены — добрасывать невыгодно
    await sleep(1000); if (!alive()) return;
    await rollAnimated(); if (!alive()) return;
  }
  await sleep(900); if (!alive()) return;
  var cat = cpuChooseCategory(game.players[game.current], game.dice, app.level);
  app.thinking = false;
  scoreCategory(game, cat);
  render();
  continueIfCpu();
}

function continueIfCpu() {
  if (app.mode === 'cpu' && !app.thinking && !game.gameOver && game.current === 1) cpuTurn();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {

  });
}

function statusText() {

  if (game.rollsUsed >= MAX_ROLLS) return 'Выберите клетку для записи';
  return 'Зафиксируйте кубики или бросьте ещё';
}

function rollLabel() {
  if (app.thinking) return 'Ход компьютера';

}

function diceHtml() {

    for (var k = 0; k < 9; k++) {

    '<div><small>Игра окончена</small><h2>' + title + '</h2></div>' +
    '<div class="results">' + rows + '</div>' +
    '<div class="dialog-actions"><button class="btn-secondary" id="menu" data-key="menu">В меню</button>' +
    '<button class="btn-primary" id="again" data-key="again">Играть снова</button></div></div></div>';
}

function rulesHtml() {
  function block(title, text) {
    return '<div class="rule"><b>' + title + '</b><span>' + text + '</span></div>';
  }
  return '<div class="overlay sheet-overlay" role="dialog" aria-modal="true" aria-label="Правила"><div class="dialog rules">' +
    '<div class="rules-head"><h2>Правила</h2><button class="btn-secondary small" data-act="close" data-autofocus data-key="close">Закрыть</button></div>' +
    block('Ход', 'До трёх бросков за ход. Нажмите на кубик, чтобы зафиксировать его — он не перебрасывается. В конце хода запишите результат ровно в одну свободную клетку. Игра идёт, пока не заполнены все 13 клеток.') +
    block('Верхняя секция', 'Единицы–шестёрки: сумма кубиков с нужной гранью. Если сумма секции 63 и больше — бонус +35.') +
    block('Нижняя секция', 'Сет (3 одинаковых) и каре (4) — сумма всех кубиков. Фулл-хаус 3+2 — 25. Малый стрит (4 подряд) — 30. Большой стрит (5 подряд) — 40. Ятзи (5 одинаковых) — 50. Шанс — сумма всех кубиков. Не получилось — запишите 0.') +
    block('Повторный ятзи и жокер', 'Если «Ятзи» уже стоит 50, каждый новый ятзи даёт +100. Когда клетка «Ятзи» занята, действует жокер: сначала верхняя клетка этой грани; если занята — любая свободная нижняя (фулл-хаус и стриты дают полные очки); если и их нет — любая верхняя.') +
    block('Итог', 'Обе секции плюс бонусы. Побеждает больший счёт.') +
    '</div></div>';
}

function confirmHtml() {
  return '<div class="overlay" role="alertdialog" aria-modal="true" aria-label="Новая игра"><div class="dialog">' +
    '<h2>Начать заново?</h2><span class="muted-text">Текущая партия будет потеряна.</span>' +
    '<div class="dialog-actions"><button class="btn-secondary" data-act="close" data-autofocus data-key="cancel">Отмена</button>' +
    '<button class="btn-primary" data-act="restart" data-key="restart">Начать заново</button></div></div></div>';
}

function exitHtml() {
  return '<div class="overlay" role="alertdialog" aria-modal="true" aria-label="Выйти в главное меню"><div class="dialog">' +
    '<h2>Выйти в главное меню?</h2><span class="muted-text">Текущая партия будет потеряна.</span>' +
    '<div class="dialog-actions"><button class="btn-secondary" data-act="close" data-autofocus data-key="cancel">Остаться</button>' +
    '<button class="btn-primary" data-act="menu" data-key="menu-exit">Выйти</button></div></div></div>';
}

function modalHtml() {
  if (app.modal === 'rules') return rulesHtml();
  if (app.modal === 'confirm') return confirmHtml();
  if (app.modal === 'exit') return exitHtml();
  return '';
}

function startHtml() {
  var logo = [5, 3, 6].map(function (v, i) {
    var pips = '';
    for (var k = 0; k < 9; k++) pips += '<span><i class="' + (PIPS[v].indexOf(k) >= 0 ? 'on' : '') + '"></i></span>';
    return '<div class="die-mini" style="transform:rotate(' + [-8, 4, -3][i] + 'deg)">' + pips + '</div>';
  }).join('');
  var cpu = app.mode === 'cpu';
  return '<div class="start">' +
    '<div class="brand-row"><div class="brand"><div class="logo">' + logo + '</div><h1>Ятзи</h1></div>' + themeButtonHtml() + '</div>' +
    '<div class="field"><div class="field-title">Режим</div><div class="modes">' +
      '<button class="mode-btn" data-key="mode-cpu" data-mode="cpu" aria-pressed="' + cpu + '">Против компьютера</button>' +
      '<button class="mode-btn" data-key="mode-hot" data-mode="hot" aria-pressed="' + !cpu + '">Вдвоём на одном устройстве</button>' +
    '</div></div>' +
    (cpu ? '<div class="field"><div class="field-title">Сложность</div><div class="levels">' +
      '<button class="mode-btn" data-key="level-easy" data-level="easy" aria-pressed="' + (app.level === 'easy') + '">Лёгкий</button>' +
      '<button class="mode-btn" data-key="level-hard" data-level="hard" aria-pressed="' + (app.level === 'hard') + '">Сильный</button>' +
    '</div></div>' : '') +
    '<div class="field players"><div class="field-title">Игроки</div>' +
      '<input class="name-input" data-name="n1" value="' + esc(app.n1) + '" maxlength="14" aria-label="Имя первого игрока">' +
      (cpu ? '<div class="name-fixed">Компьютер</div>'
           : '<input class="name-input" data-name="n2" value="' + esc(app.n2) + '" maxlength="14" aria-label="Имя второго игрока">') +
    '</div>' +
    '<div class="start-actions"><button class="btn-play" id="play" data-key="play">Играть</button>' +
      '<button class="btn-secondary wide" data-act="rules" data-key="rules">Правила</button></div></div>';
}

function gameHtml() {
  var hints = getHints();
  var dots = '';
  for (var i = 0; i < MAX_ROLLS; i++) dots += '<i class="' + (i < rollsLeft(game) ? 'on' : '') + '"></i>';
  var canRoll = isHumanTurn() && !app.thinking && !app.rolling && !game.gameOver && game.rollsUsed < MAX_ROLLS;

  return '<div class="topbar"><div class="topbar-head"><div class="turn"><small>Ход</small><strong>' +
      (game.gameOver ? 'Игра окончена' : esc(game.players[game.current].name)) + '</strong></div>' + themeButtonHtml() + '</div>' +
      '<div class="topbar-actions"><button class="btn-secondary small" data-act="rules" data-key="rules">Правила</button>' +
      '<button class="btn-secondary small" data-act="confirm" data-key="new">Новая игра</button>' +
      '<button class="btn-secondary small" data-act="' + (game.gameOver ? 'menu' : 'exit') + '" data-key="exit">В меню</button></div></div>' +
    '<div class="layout">' +
      '<section class="card play">' +
        '<div class="status-row"><span class="status" aria-live="polite">' + statusText() + '</span>' +
          '<span class="roll-dots" role="img" aria-label="Осталось бросков: ' + rollsLeft(game) + '">' + dots + '</span></div>' +
        '<div class="dice">' + diceHtml() + '</div>' +
        '<button class="roll-btn" id="roll" data-key="roll"' + (canRoll ? '' : ' disabled') + '>' + rollLabel() + '</button>' +
      '</section>' +
      '<section class="card sheet">' + upperSheetHtml(hints) + '</section>' +
      '<section class="card sheet">' + lowerSheetHtml(hints) + '</section>' +
    '</div>' +
    (game.gameOver ? gameOverHtml() : '');
}

// Обновляет существующие узлы по новой разметке: элементы сохраняются, поэтому работают CSS-переходы и фокус
function morph(from, to) {
  if (from.nodeType === 1 && to.nodeType === 1) {
    Array.prototype.slice.call(from.attributes).forEach(function (attr) {
      if (!to.hasAttribute(attr.name)) from.removeAttribute(attr.name);
    });
    Array.prototype.slice.call(to.attributes).forEach(function (attr) {
      if (from.getAttribute(attr.name) !== attr.value) from.setAttribute(attr.name, attr.value);
    });
  }
  var i = 0;
  while (i < to.childNodes.length) {
    var a = from.childNodes[i], b = to.childNodes[i];
    if (!a) from.appendChild(b.cloneNode(true));
    else if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName ||
             (a.nodeType === 1 && a.getAttribute('data-morph-key') !== b.getAttribute('data-morph-key'))) {
      from.replaceChild(b.cloneNode(true), a);
    } else if (a.nodeType === 3) {
      if (a.data !== b.data) a.data = b.data;
    } else morph(a, b);
    i++;
  }
  while (from.childNodes.length > to.childNodes.length) from.removeChild(from.lastChild);
}

function render() {
  var tpl = document.createElement('template');
  tpl.innerHTML = '<div class="screen" data-morph-key="' + app.screen + '">' +
    (app.screen === 'start' ? startHtml() : gameHtml()) + '</div>' + modalHtml();
  morph(appEl, tpl.content);
  if (app.modal) {
    var auto = appEl.querySelector('[data-autofocus]');
    if (auto && !auto.closest('.overlay').contains(document.activeElement)) auto.focus();
  }
}

// Закрытие окна с плавным исчезновением
function closeModal() {
  var overlay = appEl.querySelector('.overlay');
  if (!overlay || prefersReducedMotion()) { app.modal = null; render(); return; }
  overlay.classList.add('closing');
  setTimeout(function () { app.modal = null; render(); }, 180);
}

appEl.addEventListener('input', function (e) {
  var name = e.target.getAttribute('data-name');
  if (name) app[name] = e.target.value;
});

appEl.addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn || btn.disabled) return;
  var act = btn.getAttribute('data-act');
  if (act === 'rules' || act === 'confirm' || act === 'exit') app.modal = act;
  else if (act === 'menu') toMenu();
  else if (act === 'theme') toggleTheme();
  else if (act === 'close') { closeModal(); return; }
  else if (act === 'restart') startGame();
  else if (btn.hasAttribute('data-mode')) app.mode = btn.getAttribute('data-mode');
  else if (btn.hasAttribute('data-level')) app.level = btn.getAttribute('data-level');
  else if (btn.id === 'play' || btn.id === 'again') startGame();
  else if (btn.id === 'menu') toMenu();
  else if (btn.id === 'roll') { rollAnimated(); return; }
  else if (btn.hasAttribute('data-die')) toggleHold(game, Number(btn.getAttribute('data-die')));
  else if (btn.hasAttribute('data-cat')) scoreCategory(game, btn.getAttribute('data-cat'));
  render();
  if (app.screen === 'game') continueIfCpu();
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && app.modal) closeModal();
});

loadTheme();
applyTheme();
try {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
    if (themeChoice === 'auto') render();
  });
} catch (e) { /* старые браузеры */ }

render();
// </ui>
</script>
</body>
</html>
